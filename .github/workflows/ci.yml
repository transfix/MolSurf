name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Cheap jobs cancel on new pushes for fast feedback.
# Packaging jobs keep running so branch builds still produce downloadable
# binaries even when new commits arrive during a long package step.

jobs:
  format-check:
    name: clang-format (whole codebase)
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.ref }}-format-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Run clang-format --dry-run --Werror on all tracked sources
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git ls-files -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' \
            '*.h' '*.hh' '*.hpp' '*.hxx')
          echo "Checking ${#FILES[@]} files against .clang-format ..."
          if clang-format --dry-run --Werror "${FILES[@]}"; then
            echo "Formatting OK."
            exit 0
          fi
          echo "::error::clang-format would reformat files. To apply locally:"
          echo "  clang-format -i \$(git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx')"
          exit 1

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            build_type: Debug
          - os: ubuntu-latest
            build_type: Release
          # macOS
          - os: macos-latest
            build_type: Debug
          - os: macos-latest
            build_type: Release
          # Windows
          - os: windows-latest
            build_type: Debug
          - os: windows-latest
            build_type: Release

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    concurrency:
      group: ci-${{ github.ref }}-build-${{ matrix.os }}-${{ matrix.build_type }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── vcpkg binary cache (Windows + macOS) ──
      # Persist vcpkg's compiled package binaries in the GitHub Actions
      # cache so that subsequent runs reuse them instead of rebuilding the
      # entire Boost+CGAL+GMP+MPFR+LAPACK toolchain from source (~1h).
      # macOS uses vcpkg for Boost too because the current Homebrew `boost`
      # formula ships an incomplete CMake config and the versioned
      # `boost@1.85` formula was disabled on 2026-04-05.
      - name: Export GitHub Actions cache env (vcpkg)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      # ── FetchContent _deps cache (libcvc, NFFT fallback) ──
      # libcvc is pinned by commit SHA so the cache key is stable across
      # runs; flush it whenever the top-level CMakeLists.txt or any
      # Setup*.cmake module changes.
      - name: Cache CMake FetchContent _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'CMake/Setup*.cmake') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.build_type }}-
            deps-${{ runner.os }}-

      # ── Linux dependencies ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            autoconf automake libtool pkg-config \
            libboost-all-dev \
            libfftw3-dev \
            libnfft3-dev \
            libcgal-dev \
            libgmp-dev \
            libmpfr-dev \
            liblapack-dev \
            libblas-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxext-dev libxi-dev libxmu-dev libx11-dev

      # ── macOS dependencies ──
      # Use Homebrew for system-y tools (cmake/ninja/autotools/fftw/lapack)
      # but use vcpkg for Boost + CGAL + GMP + MPFR because the current
      # Homebrew `boost` ships an incomplete CMake config and `boost@1.85`
      # was disabled upstream.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            ninja \
            autoconf automake libtool pkg-config \
            fftw \
            lapack
          # vcpkg ships preinstalled on the macos-latest runner image.
          vcpkg install \
            boost-thread boost-date-time boost-regex boost-filesystem \
            boost-system boost-chrono boost-program-options \
            boost-signals2 boost-format boost-property-tree \
            boost-algorithm boost-asio boost-any boost-array \
            boost-dynamic-bitset boost-exception boost-foreach \
            boost-function boost-lambda boost-lexical-cast \
            boost-multi-array boost-optional boost-smart-ptr \
            boost-tuple boost-utility \
            cgal gmp mpfr
          echo "VCPKG_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          # NFFT has no Homebrew formula; SetupNFFT.cmake fetches it via
          # FetchContent and builds with autotools.

      # ── Windows dependencies (vcpkg) ──
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install \
            boost-thread:x64-windows boost-date-time:x64-windows \
            boost-regex:x64-windows boost-filesystem:x64-windows \
            boost-system:x64-windows boost-chrono:x64-windows \
            boost-program-options:x64-windows boost-signals2:x64-windows \
            boost-format:x64-windows boost-property-tree:x64-windows \
            boost-algorithm:x64-windows boost-asio:x64-windows \
            boost-any:x64-windows boost-array:x64-windows \
            boost-dynamic-bitset:x64-windows boost-exception:x64-windows \
            boost-foreach:x64-windows boost-function:x64-windows \
            boost-lambda:x64-windows boost-lexical-cast:x64-windows \
            boost-multi-array:x64-windows boost-optional:x64-windows \
            boost-smart-ptr:x64-windows boost-tuple:x64-windows \
            boost-utility:x64-windows \
            fftw3:x64-windows \
            cgal:x64-windows \
            gmp:x64-windows mpfr:x64-windows \
            lapack-reference:x64-windows
          # NFFT is not in vcpkg; SetupNFFT.cmake fetches it via FetchContent.

      # ── Configure (Unix) ──
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          EXTRA=()
          if [ -n "${VCPKG_TOOLCHAIN_FILE:-}" ]; then
            EXTRA+=("-DCMAKE_TOOLCHAIN_FILE=${VCPKG_TOOLCHAIN_FILE}")
          fi
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            "${EXTRA[@]}"

      # ── Configure (Windows) ──
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      # ── Build ──
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Verify build output ──
      - name: Verify build artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ ! -d build/bin ] && [ ! -d build/lib ]; then
            echo "::error::No build/bin or build/lib directory produced"
            exit 1
          fi
          echo "Build artifacts:"
          ls -la build/bin 2>/dev/null || true
          ls -la build/lib 2>/dev/null || true

      - name: Verify build artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hasBin = Test-Path build/bin
          $hasLib = Test-Path build/lib
          if (-not ($hasBin -or $hasLib)) {
            Write-Error "No build/bin or build/lib directory produced"
            exit 1
          }
          if ($hasBin) { Get-ChildItem build/bin -Recurse | Select-Object FullName }
          if ($hasLib) { Get-ChildItem build/lib -Recurse | Select-Object FullName }

      # ── Upload build artifacts ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/bin/
            build/lib/
          retention-days: 14
          if-no-files-found: ignore

  package-linux:
    runs-on: ubuntu-latest
    name: package / linux
    concurrency:
      group: ci-${{ github.ref }}-package-linux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          ARCH=$(uname -m)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build dpkg-dev \
            autoconf automake libtool pkg-config \
            libboost-all-dev libfftw3-dev libnfft3-dev \
            libcgal-dev libgmp-dev libmpfr-dev \
            liblapack-dev libblas-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxext-dev libxi-dev libxmu-dev libx11-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Create portable tarball
        run: |
          STEM="MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}"
          cmake --install build --prefix staging/MolSurf || true
          mkdir -p staging/MolSurf/lib staging/MolSurf/bin
          # Fall back to copying build outputs if install was a no-op
          if [ -d build/bin ]; then
            cp -r build/bin/. staging/MolSurf/bin/ 2>/dev/null || true
          fi
          if [ -d build/lib ]; then
            cp -r build/lib/. staging/MolSurf/lib/ 2>/dev/null || true
          fi
          for bin in staging/MolSurf/bin/*; do
            [ -x "$bin" ] || continue
            ldd "$bin" 2>/dev/null | grep -oP '/\S+lib(fftw|nfft|gmp|mpfr|gsl|CGAL)\S+' | while read lib; do
              cp -uL "$lib" staging/MolSurf/lib/ 2>/dev/null || true
            done
          done
          cp README.md staging/MolSurf/ 2>/dev/null || true
          tar -czf "$STEM.tar.gz" -C staging MolSurf

      - name: Build .deb package
        run: |
          STEM="MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}"
          cd build
          cpack -G DEB || { echo "::warning::cpack DEB failed; skipping"; exit 0; }
          for f in *.deb; do cp "$f" "../$STEM.deb"; done

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}.tar.gz
          path: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}.deb
          path: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-linux-${{ steps.meta.outputs.arch }}.deb
          if-no-files-found: ignore
          retention-days: 30

  package-macos:
    runs-on: macos-latest
    name: package / macos
    concurrency:
      group: ci-${{ github.ref }}-package-macos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          ARCH=$(uname -m)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Export GitHub Actions cache env (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      - name: Cache CMake FetchContent _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macOS-package-${{ hashFiles('CMakeLists.txt', 'CMake/Setup*.cmake') }}
          restore-keys: |
            deps-macOS-package-
            deps-macOS-

      - name: Install dependencies
        run: |
          brew install cmake ninja autoconf automake libtool pkg-config \
            fftw lapack
          # See ci.yml note on macOS Boost: current Homebrew `boost` ships
          # an incomplete CMake config and `boost@1.85` was disabled, so
          # use vcpkg for Boost/CGAL/GMP/MPFR.
          vcpkg install \
            boost-thread boost-date-time boost-regex boost-filesystem \
            boost-system boost-chrono boost-program-options \
            boost-signals2 boost-format boost-property-tree \
            boost-algorithm boost-asio boost-any boost-array \
            boost-dynamic-bitset boost-exception boost-foreach \
            boost-function boost-lambda boost-lexical-cast \
            boost-multi-array boost-optional boost-smart-ptr \
            boost-tuple boost-utility \
            cgal gmp mpfr
          echo "VCPKG_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TOOLCHAIN_FILE" \
            -DCMAKE_INSTALL_PREFIX=/usr/local

      - name: Build
        run: cmake --build build --parallel

      - name: Create .dmg and .zip
        run: |
          STEM="MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}"
          cmake --install build --prefix staging/MolSurf.app/Contents/Resources || true
          mkdir -p staging/MolSurf.app/Contents/MacOS staging/MolSurf.app/Contents/Frameworks
          # Fall back to copying build outputs if install was a no-op
          if [ -d build/bin ]; then
            cp -r build/bin/. staging/MolSurf.app/Contents/MacOS/ 2>/dev/null || true
          fi
          for bin in staging/MolSurf.app/Contents/MacOS/*; do
            [ -x "$bin" ] || continue
            otool -L "$bin" 2>/dev/null | grep -oE '/[^ ]+lib(fftw|nfft|gmp|mpfr|CGAL)[^ ]+' | while read lib; do
              bname=$(basename "$lib")
              cp -n "$lib" staging/MolSurf.app/Contents/Frameworks/ 2>/dev/null || true
              install_name_tool -change "$lib" "@executable_path/../Frameworks/$bname" "$bin" 2>/dev/null || true
            done
          done
          cp README.md staging/MolSurf.app/Contents/Resources/ 2>/dev/null || true
          ditto -c -k --keepParent staging/MolSurf.app "$STEM.zip"
          hdiutil create -volname MolSurf \
            -srcfolder staging/MolSurf.app \
            -ov -format UDZO \
            "$STEM.dmg"

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}.dmg
          path: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}.zip
          path: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-macos-${{ steps.meta.outputs.arch }}.zip
          if-no-files-found: error
          retention-days: 30

  package-windows:
    runs-on: windows-latest
    name: package / windows
    concurrency:
      group: ci-${{ github.ref }}-package-windows
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Export GitHub Actions cache env (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      - name: Cache CMake FetchContent _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-Windows-package-${{ hashFiles('CMakeLists.txt', 'CMake/Setup*.cmake') }}
          restore-keys: |
            deps-Windows-package-
            deps-Windows-

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{gsub(/[^0-9.]/,"",$2); print $2; exit}' CMakeLists.txt)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "arch=x64" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        shell: bash
        run: |
          vcpkg install \
            boost-thread:x64-windows boost-date-time:x64-windows \
            boost-regex:x64-windows boost-filesystem:x64-windows \
            boost-system:x64-windows boost-chrono:x64-windows \
            boost-program-options:x64-windows boost-signals2:x64-windows \
            boost-format:x64-windows boost-property-tree:x64-windows \
            boost-algorithm:x64-windows boost-asio:x64-windows \
            boost-any:x64-windows boost-array:x64-windows \
            boost-dynamic-bitset:x64-windows boost-exception:x64-windows \
            boost-foreach:x64-windows boost-function:x64-windows \
            boost-lambda:x64-windows boost-lexical-cast:x64-windows \
            boost-multi-array:x64-windows boost-optional:x64-windows \
            boost-smart-ptr:x64-windows boost-tuple:x64-windows \
            boost-utility:x64-windows \
            fftw3:x64-windows cgal:x64-windows \
            gmp:x64-windows mpfr:x64-windows \
            lapack-reference:x64-windows

      - name: Configure
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create zip
        shell: bash
        run: |
          STEM="MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}"
          cmake --install build --config Release --prefix staging/MolSurf || true
          mkdir -p staging/MolSurf/bin
          if [ -d build/bin ]; then
            find build/bin -name '*.exe' -exec cp {} staging/MolSurf/bin/ \; 2>/dev/null || true
            find build/bin -name '*.dll' -exec cp {} staging/MolSurf/bin/ \; 2>/dev/null || true
          fi
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll staging/MolSurf/bin/ 2>/dev/null || true
          cp README.md staging/MolSurf/ 2>/dev/null || true
          cd staging
          7z a -tzip ../"$STEM.zip" MolSurf/

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}.zip
          path: MolSurf-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}-windows-${{ steps.meta.outputs.arch }}.zip
          if-no-files-found: error
          retention-days: 30
